name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Translation catalogues are built from their parts
        run: |
          python translations/build.py
          git diff --exit-code -- translations/tr.json translations/it.json
      - run: python -m pytest

  docker:
    name: Docker image builds and answers the health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bassignana-epc-control .
      - run: |
          docker run -d --name bassignana -p 8080:8080 \
            -e BASSIGNANA_ACCESS_PASSWORD=ci-password bassignana-epc-control
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs bassignana
          exit 1
